<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALIDAD AUMENTADA KIA_víctor</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.0.0/dist/model-viewer.js"></script>
    <style>
        #measures {
            font-size: 18px;
            color: white;
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Visualización de modelo 3D</h1>
    <div id="measures"></div>
    
    <model-viewer 
        id="car-model"
        src="https://victorcastillainfova.github.io/MODELOAR2/KIA-2.glb"
        alt="Modelo KIA"
        auto-rotate
        camera-controls
        ar
        style="width: 100%; height: 500px;">
    </model-viewer>

    <script>
        document.querySelector('model-viewer').addEventListener('load', function() {
            // Medidas del coche en metros
            const dimensions = {
                alto: 1.5,   // Ajusta a las medidas reales
                ancho: 2.0,  // Ajusta a las medidas reales
                largo: 4.5   // Ajusta a las medidas reales
            };

            // Mostrar medidas en la pantalla
            const measuresText = `Alto: ${dimensions.alto}m, Ancho: ${dimensions.ancho}m, Largo: ${dimensions.largo}m`;
            document.getElementById('measures').textContent = measuresText;

            // Evento para abrir puertas si existe la animación
            const model = document.querySelector('model-viewer');
            model.addEventListener('click', function() {
                model.animationName = "abrir_puertas"; // Asegúrate de que la animación de apertura se llama "abrir_puertas"
                model.play();
            });
        });
    </script>
</body>
</html>
