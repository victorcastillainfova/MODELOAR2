<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D - KIA</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.0.0/dist/model-viewer.js"></script>
    <style>
        body {
            text-align: center;
            background-color: #222;
            color: white;
        }
        #controls {
            margin: 10px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        /* Estilos de los hotspots */
        .hotspot {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
            display: block;
            position: relative;
        }
    </style>
</head>
<body>
    <h1>Visualización de modelo 3D</h1>

    <div id="controls">
        <button onclick="toggleDoors()">Abrir/Cerrar Puertas</button>
    </div>

    <model-viewer 
        id="car-model"
        src="https://victorcastillainfova.github.io/MODELOAR/KIA-2.glb"
        alt="Modelo KIA"
        auto-rotate
        camera-controls
        ar
        ar-modes="scene-viewer quick-look webxr"
        style="width: 100%; height: 500px;">
        
        <button slot="ar-button">Ver en RA</button>

        <!-- Hotspots para medidas -->
        <button class="hotspot" slot="hotspot-1" data-position="0 1.5 0" data-normal="0 1 0">
            Alto: 1.5m
        </button>
        <button class="hotspot" slot="hotspot-2" data-position="1 0.8 0" data-normal="1 0 0">
            Ancho: 2.0m
        </button>
        <button class="hotspot" slot="hotspot-3" data-position="0 0 2" data-normal="0 0 1">
            Largo: 4.5m
        </button>

        <!-- Botón dentro del modelo para abrir puertas -->
        <button class="hotspot" slot="hotspot-4" data-position="0 1 1.5" data-normal="0 0 1" onclick="toggleDoors()">
            Abrir/Cerrar Puertas
        </button>

    </model-viewer>

    <script>
        let doorsOpen = false;

        function toggleDoors() {
            const model = document.getElementById('car-model');
            doorsOpen = !doorsOpen;
            model.animationName = doorsOpen ? "abrir_puertas" : "cerrar_puertas";
            model.play();
        }
    </script>
</body>
</html>
