<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Interactivo - Kia Ceed Sportwagon 1.6</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.0.0/dist/model-viewer.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 20px;
        }
        #controls {
            margin: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #info-box {
            display: none;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            position: absolute;
            top: 100px;
            max-width: 300px;
            z-index: 10;
        }
        #info-box h2 {
            margin-top: 0;
        }
        #close-info {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            float: right;
        }
        .hotspot {
            background: rgba(255, 0, 0, 0.8);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            border: none;
            position: absolute;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Kia Ceed Sportwagon 1.6 - Visor 3D Interactivo</h1>

    <div id="controls">
        <button id="specsButton">Especificaciones Técnicas</button>
        <button id="faultsButton">Simulación de Averías</button>
    </div>

    <model-viewer id="carModel"
        src="https://victorcastillainfova.github.io/MODELOAR2/Kia-2.glb"
        alt="Modelo 3D del Kia Ceed Sportwagon 1.6"
        auto-rotate
        camera-controls
        ar
        ar-modes="scene-viewer quick-look webxr"
        style="width: 100%; height: 500px;">
        <button slot="ar-button">Ver en RA</button>
        <!-- Hotspots para simular averías -->
        <button class="hotspot" id="engineHotspot" data-position="0 0.5 1" data-normal="0 0 1" title="Motor"></button>
        <button class="hotspot" id="transmissionHotspot" data-position="0 -0.5 0" data-normal="0 0 1" title="Transmisión"></button>
        <button class="hotspot" id="suspensionHotspot" data-position="0 0 1.5" data-normal="0 0 1" title="Suspensión"></button>
    </model-viewer>

    <div id="info-box">
        <button id="close-info">Cerrar</button>
        <div id="info-content"></div>
    </div>

    <script>
        const carModel = document.getElementById('carModel');
        const specsButton = document.getElementById('specsButton');
        const faultsButton = document.getElementById('faultsButton');
        const infoBox = document.getElementById('info-box');
        const infoContent = document.getElementById('info-content');
        const closeInfo = document.getElementById('close-info');
        const hotspots = document.querySelectorAll('.hotspot');

        // Mostrar especificaciones técnicas
        specsButton.addEventListener('click', () => {
            infoContent.innerHTML = `
                <h2>Especificaciones Técnicas</h2>
                <ul>
                    <li><strong>Motor:</strong> 1.6 CRDi VGT</li>
                    <li><strong>Potencia:</strong> 136 CV</li>
                    <li><strong>Transmisión:</strong> Manual de 6 velocidades</li>
                    <li><strong>Velocidad Máxima:</strong> 194 km/h</li>
                    <li><strong>Aceleración 0-100 km/h:</strong> 10.5 segundos</li>
                    <li><strong>Consumo Combinado:</strong> 4.5 l/100 km</li>
                    <li><strong>Emisiones de CO2:</strong> 119 g/km</li>
                </ul>
            `;
            infoBox.style.display = 'block';
        });

        // Simulación de averías
        faultsButton.addEventListener('click', () => {
            hotspots.forEach(hotspot => {
                hotspot.style.display = 'block';
            });
        });

        // Mostrar información de la avería al hacer clic en un hotspot
        hotspots.forEach(hotspot => {
            hotspot.addEventListener('click', () => {
                const faultInfo = {
                    'engineHotspot': {
                        title: 'Problema en el Motor',
                        description: 'Posible obstrucción en el filtro de partículas diésel, lo que puede causar pérdida de potencia y aumento de emisiones.'
                    },
                    'transmissionHotspot': {
                        title: 'Fallo en la Transmisión',
                        description: 'Pérdida de aceite en la caja de cambios, lo que puede provocar cambios bruscos y desgaste prematuro.'
                    },
                    'suspensionHotspot': {
                        title: 'Problema en la Suspensión',
                        description: 'Desgaste en los amortiguadores, reduciendo la estabilidad del vehículo en curvas.'
                    }
                };

                const data = faultInfo[hotspot.id];
                infoContent.innerHTML = `<h2>${data.title}</h2><p>${data.description}</p>`;
                infoBox.style.display = 'block';
            });
        });

        // Cerrar el cuadro de información
        closeInfo.addEventListener('click', () => {
            infoBox.style.display = 'none';
        });
    </script>
</body>
</html>
