<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D en AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; }
        model-viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- Visor del modelo 3D -->
    <model-viewer id="carModel" src="KIA-2.glb" ar camera-controls auto-rotate></model-viewer>

    <script>
        let rotationAngle = 0;

        function rotateModel(degrees) {
            const modelViewer = document.getElementById('carModel');
            rotationAngle += degrees;
            if (rotationAngle >= 360) rotationAngle = 0;
            modelViewer.setAttribute('rotation', 0 ${rotationAngle}deg 0);
            console.log("Ángulo actualizado:", rotationAngle);
        }

        // Asegurar que la función está disponible en la consola
        window.rotateModel = rotateModel;
    </script>

</body>
</html>
