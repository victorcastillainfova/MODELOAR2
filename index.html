<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D de Coche</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; }
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #000;
        }
    </style>
</head>
<body>
    <model-viewer id="carModel"
        src="https://victorcastillainfova.github.io/MODELOAR2/KIA-2.glb"
        camera-controls
        auto-rotate
        ar>
    </model-viewer>

    <script>
        window.rotateCar = function(degrees) {
            const model = document.getElementById("carModel");
            model.cameraOrbit = ${degrees}deg 75deg 0deg;
        };
    </script>
</body>
</html>
