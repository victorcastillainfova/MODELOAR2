<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@2.0.0/dist/model-viewer.min.js"></script>
</head>
<body>

    <h1>Vista en AR del modelo estudios3d</h1>
    
    <model-viewer 
        src="https://raw.githubusercontent.com/victorcastillainfova/MODELOAR2/main/estudios3d.glb" 
        alt="Modelo 3D de estudios3d"
        auto-rotate
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        style="width: 100%; height: 600px;">
    </model-viewer>

</body>
</html>
