<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALIDAD AUMENTADA KIA_víctor</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.0.0/dist/model-viewer.js"></script>
    <style>
        body {
            text-align: center;
            background-color: #222;
            color: white;
        }
        #controls {
            margin: 10px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
        .annotation {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Visualización de modelo 3D</h1>

    <div id="controls">
        <button onclick="toggleMeasurements()">Mostrar/Ocultar Medidas</button>
        <button onclick="toggleDoors()">Abrir/Cerrar Puertas</button>
    </div>

    <model-viewer 
        id="car-model"
        src="https://victorcastillainfova.github.io/MODELOAR2/KIA-2.glb"
        alt="Modelo KIA"
        auto-rotate
        camera-controls
        ar
        ar-modes="scene-viewer quick-look webxr"
        style="width: 100%; height: 500px;">
        <button slot="ar-button">Ver en RA</button>

        <!-- Etiquetas de medidas -->
        <div id="measurements">
            <div class="annotation" id="height" style="top: 20%; left: 50%;">Alto: 1.5m</div>
            <div class="annotation" id="width" style="top: 50%; left: 90%;">Ancho: 2.0m</div>
            <div class="annotation" id="length" style="top: 80%; left: 50%;">Largo: 4.5m</div>
        </div>
    </model-viewer>

    <script>
        let doorsOpen = false;
        let measuresVisible = false;

        function toggleDoors() {
            const model = document.getElementById('car-model');
            doorsOpen = !doorsOpen;
            model.animationName = doorsOpen ? "abrir_puertas" : "cerrar_puertas";
            model.play();
        }

        function toggleMeasurements() {
            measuresVisible = !measuresVisible;
            document.querySelectorAll('.annotation').forEach(el => {
                el.style.display = measuresVisible ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
