<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D Interactivo - Kia Ceed Sportwagon 1.6</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.0.0/dist/model-viewer.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 20px;
        }
        #controls {
            margin: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        #info-box {
            display: none;
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            position: absolute;
            top: 100px;
            max-width: 300px;
            z-index: 10;
        }
        #info-box h2 {
            margin-top: 0;
        }
        #close-info {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            float: right;
        }
        #colorSelector {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Kia Ceed Sportwagon 1.6 - Visor 3D Interactivo</h1>

    <div id="controls">
        <button id="specsButton">Especificaciones Técnicas</button>
    </div>

    <div id="colorSelector">
        <label for="colorSelect">Seleccionar color del coche:</label>
        <select id="colorSelect">
            <option value="original">Original</option>
            <option value="black">Negro</option>
            <option value="white">Blanco</option>
            <option value="blue">Azul</option>
            <option value="yellow">Amarillo</option>
        </select>
    </div>

    <model-viewer id="carModel"
        src="https://victorcastillainfova.github.io/MODELOAR2/KIA-2.glb"
        alt="Modelo 3D del Kia Ceed Sportwagon 1.6"
        auto-rotate
        camera-controls
        ar
        ar-modes="scene-viewer quick-look webxr"
        style="width: 100%; height: 500px;">
        <button slot="ar-button">Ver en RA</button>
    </model-viewer>

    <div id="info-box">
        <button id="close-info">Cerrar</button>
        <div id="info-content"></div>
    </div>

    <script>
        const carModel = document.getElementById('carModel');
        const specsButton = document.getElementById('specsButton');
        const infoBox = document.getElementById('info-box');
        const infoContent = document.getElementById('info-content');
        const closeInfo = document.getElementById('close-info');
        const colorSelect = document.getElementById('colorSelect');

        // Mostrar especificaciones técnicas
        specsButton.addEventListener('click', () => {
            infoContent.innerHTML = `
                <h2>Especificaciones Técnicas</h2>
                <ul>
                    <li><strong>Motor:</strong> 1.6 CRDi VGT</li>
                    <li><strong>Potencia:</strong> 136 CV</li>
                    <li><strong>Transmisión:</strong> Manual de 6 velocidades</li>
                    <li><strong>Velocidad Máxima:</strong> 194 km/h</li>
                    <li><strong>Aceleración 0-100 km/h:</strong> 10.5 segundos</li>
                    <li><strong>Consumo Combinado:</strong> 4.5 l/100 km</li>
                    <li><strong>Emisiones de CO2:</strong> 119 g/km</li>
                </ul>
            `;
            infoBox.style.display = 'block';
        });

        // Cambiar color del coche en el visor 3D
        colorSelect.addEventListener('change', (event) => {
            const selectedColor = event.target.value;
            if (selectedColor === "black") {
                carModel.setAttribute('style', 'width: 100%; height: 500px; filter: hue-rotate(180deg)');
            } else if (selectedColor === "white") {
                carModel.setAttribute('style', 'width: 100%; height: 500px; filter: hue-rotate(90deg)');
            } else if (selectedColor === "blue") {
                carModel.setAttribute('style', 'width: 100%; height: 500px; filter: hue-rotate(240deg)');
            } else if (selectedColor === "yellow") {
                carModel.setAttribute('style', 'width: 100%; height: 500px; filter: hue-rotate(60deg)');
            } else {
                carModel.setAttribute('style', 'width: 100%; height: 500px;'); // Original color
            }
        });

        // Cerrar el cuadro de información
        closeInfo.addEventListener('click', () => {
            infoBox.style.display = 'none';
        });
    </script>
</body>
</html>
