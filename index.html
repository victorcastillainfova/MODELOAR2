<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parchís en RA</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer"></script>
    <style>
        body { margin: 0; text-align: center; font-family: Arial, sans-serif; }
    </style>
</head>
<body>

    <!-- Visor de Realidad Aumentada -->
    <model-viewer 
        src="https://victorcastillainfova.github.io/MODELOAR2/KIA-2.glb"
        ar 
        ar-modes="webxr scene-viewer quick-look"
        camera-controls 
        environment-image="neutral"
        style="width: 100vw; height: 80vh;"
        id="parchis">
        
        <!-- Dado 3D dentro de la escena -->
        <model-viewer 
            id="dado"
            src="https://victorcastillainfova.github.io/MODELOAR2/dado.glb"
            slot="hotspot-dado"
            ar 
            camera-controls
            style="width: 50px; height: 50px;"
            exposure="1"
            shadow-intensity="1">
        </model-viewer>

    </model-viewer>

    <script>
        const dado = document.getElementById("dado");

        dado.addEventListener("click", () => {
            const caras = [
                "0 0 0",   // 1
                "0 90 0",  // 2
                "0 180 0", // 3
                "0 270 0", // 4
                "90 0 0",  // 5
                "-90 0 0"  // 6
            ];
            
            let resultado = Math.floor(Math.random() * 6);
            dado.setAttribute("rotation", caras[resultado]);

            alert("Has sacado un " + (resultado + 1));
        });
    </script>

</body>
</html>
